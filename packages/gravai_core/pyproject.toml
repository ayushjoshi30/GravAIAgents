[project]
name = "gravai-core"
version = "0.1.0"
description = "GravAI core: settings, tenancy, auth, audit, PII, persistence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    # Windows ships no system zoneinfo database, so Asia/Kolkata cannot be
    # resolved without this. Required, not optional (DECISIONS.md D-009).
    "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravai_core"]
