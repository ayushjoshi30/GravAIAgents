[project]
name = "gravai-connectors"
version = "0.1.0"
description = "Connectors to Graviton, the BRE, DigiLocker, Account Aggregator, telephony and notifications"
requires-python = ">=3.12"
dependencies = ["gravai-core", "httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravai_connectors"]

[tool.uv.sources]
gravai-core = { workspace = true }
