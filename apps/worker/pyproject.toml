[project]
name = "gravai-worker"
version = "0.1.0"
description = "GravAI Temporal workers: durable agent workflows and activities"
requires-python = ">=3.12"
dependencies = ["gravai-core", "gravai-agents", "gravai-sarvam", "gravai-connectors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravai_worker"]

[tool.uv.sources]
gravai-core = { workspace = true }
gravai-agents = { workspace = true }
gravai-sarvam = { workspace = true }
gravai-connectors = { workspace = true }
