<!--
  GravAI monogram — the Graviton G, unaltered.

  The same G from the wordmark, scaled 2.2x and centred in a 40x40 square with
  ~7 units of clear space. Nothing is redrawn: this is the identical outline,
  which is what makes the app icon and the wordmark recognisably one mark.

  Inherits `currentColor`. Use gravai-mark-color.svg where the brand blue must
  be fixed regardless of context.
-->
