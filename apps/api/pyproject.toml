[project]
name = "gravai-api"
version = "0.1.0"
description = "GravAI REST API"
requires-python = ">=3.12"
dependencies = [
    "gravai-core",
    "gravai-agents",
    "gravai-connectors",
    "gravai-runner",
    "gravai-workflow",
    "gravai-mcp",
    "gravai-sarvam",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravai_api"]

[tool.uv.sources]
gravai-core = { workspace = true }
gravai-agents = { workspace = true }
gravai-connectors = { workspace = true }
gravai-runner = { workspace = true }
gravai-workflow = { workspace = true }
gravai-mcp = { workspace = true }
gravai-sarvam = { workspace = true }
