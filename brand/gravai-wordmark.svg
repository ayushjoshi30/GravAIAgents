<!--
  GravAI wordmark — derived from the GRAVITON wordmark, not redrawn.

  GRAVITON already contains every letter GravAI needs. The G, R, A and V sit at
  their original coordinates, untouched. The second A and the I are the same
  letterforms translated along the baseline:

      A  +39.7   (leaves a 9.47 gap after V — the widest natural gap in the
                  source mark, which is what marks the GRAV | AI split without
                  inventing spacing that is not already in the type)
      I  +21.6   (leaves 8.42 — identical to the source's V→I gap)

  Colour carries the meaning: GRAV in the Graviton blue, AI in the platform's
  teal. Same family, new layer.
-->
